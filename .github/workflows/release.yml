name: CloudFrame Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('main-{0}', github.run_number) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "FrameBoost/FrameBoost.csproj"

      - name: Build
        run: dotnet build "FrameBoost/FrameBoost.csproj" -c Release --no-restore

      - name: Publish self-contained release
        run: dotnet publish "FrameBoost/FrameBoost.csproj" -c Release -r win-x64 --self-contained true --no-build

      - name: Create distributable archive
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "dist\CloudFrame"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE ("CloudFrame-win-x64-" + $env:RELEASE_LABEL + ".zip")
          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }
          Compress-Archive -Path (Join-Path $releaseRoot "*") -DestinationPath $archivePath

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFrame-win-x64
          path: |
            dist/CloudFrame/**
            CloudFrame-win-x64-*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CloudFrame-win-x64-*.zip
          generate_release_notes: true
